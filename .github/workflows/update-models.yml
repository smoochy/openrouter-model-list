name: Update model lists

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: update-model-lists
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync

      - name: Generate models-mengram.json
        run: uv run scripts/generate_models.py --profile mengram
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate models-yt-summarizer.json
        run: uv run scripts/generate_models.py --profile yt-summarizer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate models-openwiki.json
        run: uv run scripts/generate_models.py --profile openwiki
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Create pull request if there are changes
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          add-paths: |
            models-mengram.json
            models-yt-summarizer.json
            models-openwiki.json
            history/
          branch: automation/update-models
          commit-message: "Update model lists"
          title: "Update model lists"
          body: |
            Automated model list update.

            This PR was generated by the scheduled update-models workflow.

      - name: Attempt immediate merge
        if: steps.create-pr.outputs.pull-request-number
        # required_approving_review_count is 0 and there are no required status
        # checks on this repository, so this immediate self-merge under
        # GITHUB_TOKEN is not a review bypass, there is no gate here to bypass.
        # It only buys an audit trail: a same-run merge instead of a PR sitting
        # open for no reason. A refusal (branch protection quirk, a race, a
        # conflict) is expected, not an error, and must not fail this job -
        # the PR is simply left open for fleet-timed-pr-automerge to merge as
        # the App, which is the designed floor.
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --merge --repo "${{ github.repository }}" \
            && echo "Merged automatically." \
            || echo "Merge refused; leaving PR open for fleet-timed-pr-automerge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
