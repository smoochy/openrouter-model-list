# Profile for OpenWiki (agentic repo-documentation generator).
# OpenWiki reads many files per synthesis step and writes whole wiki pages
# in one shot, so it needs a large context window, a high output ceiling,
# and tool-calling for its agent loop.
min_param_b: 70

min_context_length: 128000
min_max_output_tokens: 16000
buffer_pct: 5
require_structured_output: false
require_tools: true

# Post-probe filters, using OpenRouter's aggregated endpoint stats
# (uptime_last_1d / latency_last_30m.p50). Leave empty to disable.
min_uptime:
max_latency_ms:

# If buffering shrinks the candidate pool below this, relax buffer_pct
# step-wise toward 0 until the pool is large enough (min_param_b stays fixed).
min_candidate_pool: 2

# Model IDs always included in the candidate pool, bypassing min_param_b and
# the context/output thresholds. Still must pass require_tools — excluded with
# a warning if not. Still probed and scored normally.
#
# min_param_b reads the parameter count out of the model id, and most current
# free models no longer carry a size token in their slug, so the floor drops
# them untested and leaves only Nvidia's two Nemotron models. That single
# provider is a single point of failure for the OpenWiki runs. The models
# below clear the context, output and tool-calling thresholds on their catalog
# metadata; only the unparseable size is what kept them out.
allowlist:
  - thinkingmachines/inkling:free
  - poolside/laguna-s-2.1:free
  - cohere/north-mini-code:free
  - nvidia/nemotron-3.5-lightning:free

hardallowlist: []
